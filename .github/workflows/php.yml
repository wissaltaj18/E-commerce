name: Symfony CI

on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: shivammathur/setup-php@9e72090525849c5e8e0c3f92e7c8b65c1ff8676f
        with:
          php-version: '8.2'

      - run: composer install

      - run: php bin/phpunit